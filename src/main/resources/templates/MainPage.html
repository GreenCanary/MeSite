<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace ="fragments :: head"></th:block>
</head>
<body>
<div th:replace ="fragments::topnav(currentPage='home')"></div>
<div class=" text-center">
<h1>Welcome to my site, Me|Site if you will</h1>
<h2>Here you can learn things about me!</h2>
</div>
<div class="avatar-wrapper">
    <div class="avatar-container">
        <img th:src="@{/images/mePersonality.jpg}" class="avatar shadow-purple">
        <p class="caption">My Personality</p>
    </div>
    <div class="avatar-container">
        <img th:src="@{/images/meHobbies.jpg}" class="avatar shadow-red">
        <p class="caption">My Hobbies</p>
    </div>
    <div class="avatar-container">
        <img th:src="@{/images/meWorldView.jpg}" class="avatar shadow-green">
        <p class="caption">My World View</p>
    </div>
    <div class="avatar-container">
        <img th:src="@{/images/meCareer.jpg}" class="avatar shadow-white">
        <p class="caption">My Career</p>
    </div>
</div>
<div class="avatar-container">
    <img th:src="@{/images/Map.png}" class="avatar shadow-black">
    <p class="caption">Where Do I Live?</p>
</div>
<div th:replace = "fragments :: footer"></div>
</body>
</html>
